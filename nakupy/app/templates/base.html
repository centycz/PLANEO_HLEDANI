<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>{% block title %}Nákupy{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">🛒 Nákupy</a>
  <span class="spacer"></span>
  <a class="btn btn-sm btn-ghost" href="/ucet">{{ user.display_name }}</a>
  <a class="btn btn-sm btn-ghost" href="/odhlaseni" title="Odhlásit">⎋</a>
</header>
{% endif %}

<main class="wrap">
  {% for message in flashes %}
    <div class="flash {{ message.level }}">{{ message.message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

{% if user %}
{% set path = request.url.path %}
<nav class="tabbar">
  <a href="/" class="{{ 'active' if path == '/' }}"><span class="ico">🏠</span>Přehled</a>
  <a href="/seznamy" class="{{ 'active' if path.startswith('/seznam') or path.startswith('/nakup') }}"><span class="ico">📝</span>Seznamy</a>
  <a href="/slevy" class="{{ 'active' if path.startswith('/slevy') }}"><span class="ico">🏷️</span>Slevy</a>
  <a href="/katalog" class="{{ 'active' if path.startswith('/katalog') }}"><span class="ico">📚</span>Katalog</a>
  <a href="/oblibene" class="{{ 'active' if path.startswith('/oblibene') }}"><span class="ico">★</span>Oblíbené</a>
  <a href="/nastaveni" class="{{ 'active' if path.startswith('/nastaveni') or path.startswith('/import') or path.startswith('/historie') }}"><span class="ico">⚙️</span>Víc</a>
</nav>
{% endif %}
<script src="/static/app.js" defer></script>
</body>
</html>
