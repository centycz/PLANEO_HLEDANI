# /etc/nginx/sites-available/nakupy.dalcortile.cz
# Stejny princip jako u vydaje.dalcortile.cz - jen jiny subdomena a jiny port.
#
#   ln -s /etc/nginx/sites-available/nakupy.dalcortile.cz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d nakupy.dalcortile.cz     # doplni TLS blok a presmerovani

server {
    listen 80;
    listen [::]:80;
    server_name nakupy.dalcortile.cz;

    # certbot si sem doplni presmerovani na HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nahravani PDF katalogu
        client_max_body_size 60m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8081/static/;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/nakupy.access.log;
    error_log  /var/log/nginx/nakupy.error.log;
}
